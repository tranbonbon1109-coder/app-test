
name: Build Nova Test Lab IPA

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iOS App
        run: |
          xcodebuild \
            -project NovaTestLab.xcodeproj \
            -scheme NovaTestLab \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/NovaTestLab.app Payload/
          zip -r NovaTestLab.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NovaTestLab-IPA
          path: NovaTestLab.ipa
